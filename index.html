<!DOCTYPE html>
<html>
<head>
  <title>My Blog</title>

  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    h1 {
      color: darkblue;
    }

    p {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <h1>My Blog</h1>

  <div id="blog-text">Loading...</div>

  <script>
    fetch("post.txt")
      .then(response => response.text())
      .then(text => {
        const blog = document.getElementById("blog-text");
        blog.textContent = "";

        text
          .trim()
          .split(/\n\s*\n/)
          .forEach(paragraphText => {
            const paragraph = document.createElement("p");
            paragraph.textContent = paragraphText.trim();
            blog.appendChild(paragraph);
          });
      });
  </script>
</body>
</html>
